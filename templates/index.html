<form method="POST" action="/generate_qbr" enctype="multipart/form-data">

    <label>Select Client:</label>
    <select name="client">
        <option value="acme">ACME</option>
        <option value="openai">OpenAI</option>
        <option value="globex">Globex</option>
    </select>

    <br><br>

    <label>Upload Excel File:</label>
    <input type="file" name="excel" accept=".xlsx,.xls" required>

    <br><br>

    <label>Upload PowerPoint Template:</label>
    <input type="file" name="ppt" accept=".pptx" required>

    <br><br>

    <button type="submit">Generate QBR</button>

</form>
